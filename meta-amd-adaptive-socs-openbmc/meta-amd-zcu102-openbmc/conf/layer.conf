# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "amd-zcu102-openbmc"
BBFILE_PATTERN_amd-zcu102-openbmc = "^${LAYERDIR}/"
BBFILE_PRIORITY_amd-zcu102-openbmc = "6"

# Currently no files, so set an empty pattern means ignore the error
BBFILE_PATTERN_IGNORE_EMPTY_amd-zcu102-openbmc = "1"

LAYERSUMMARY_amd-zcu102-openbmc = "AMD ZCU102 OpenBMC configurations"
LAYERDESCRIPTION_amd-zcu102-openbmc = "OpenBMC Board support package layer \
providing machine .conf, machine YAML, and device-tree assets for AMD \
Zynq UltraScale+ MPSoC ZCU102 eval board"

LAYERDEPENDS_amd-zcu102-openbmc = "\
    core \
    phosphor-layer \
    xilinx \
    xilinx-standalone \
    xilinx-standalone-sdt \
    xilinx-microblaze \
    amd-adaptive-socs-openbmc \
    amd-adaptive-socs-bsp \
    "

LAYERSERIES_COMPAT_amd-zcu102-openbmc = "wrynose"
