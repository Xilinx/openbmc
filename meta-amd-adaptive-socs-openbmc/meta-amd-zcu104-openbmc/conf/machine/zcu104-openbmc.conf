#@TYPE: Machine
#@NAME: zcu104-openbmc
#@DESCRIPTION: Machine configuration for the AMD Zynq UltraScale+ MPSoC ZCU104 evaluation kit (Cortex-A53 Linux plus FSBL and MicroBlaze PMU sub-machines), built from system device tree for OpenBMC.


BBMULTICONFIG += "zcu104-openbmc-cortexa53-fsbl zcu104-openbmc-microblaze-pmu"
MACHINEOVERRIDES .= ":zynqmp-zcu104-sdt-full"

#### Preamble
MACHINEOVERRIDES =. "${@['', 'zcu104-openbmc:']['zcu104-openbmc' !='${MACHINE}']}"
#### Regular settings follow
TUNEFILE[microblaze-pmu] = "conf/machine/include/zcu104-openbmc/microblaze.inc"

# First Stage Boot Loader
FSBL_DEPENDS = ""
FSBL_MCDEPENDS = "mc::zcu104-openbmc-cortexa53-fsbl:fsbl-firmware:do_deploy"
FSBL_DEPLOY_DIR = "${TMPDIR}-zcu104-openbmc-cortexa53-fsbl/deploy/images/${MACHINE}"

# PMU Firmware
PMU_DEPENDS = ""
PMU_MCDEPENDS = "mc::zcu104-openbmc-microblaze-pmu:pmu-firmware:do_deploy"
PMU_FIRMWARE_DEPLOY_DIR = "${TMPDIR}-zcu104-openbmc-microblaze-pmu/deploy/images/${MACHINE}"

# Set the default (linux) domain device tree
CONFIG_DTFILE_DIR := "${@bb.utils.which(d.getVar('BBPATH'), 'conf/dts/zcu104-openbmc')}"
CONFIG_DTFILE ?= "${CONFIG_DTFILE_DIR}/cortexa53-linux.dts"
CONFIG_DTFILE[vardepsexclude] += "CONFIG_DTFILE_DIR"

DTB_FILE_PATH ?= "${RECIPE_SYSROOT}/boot/devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"

# Serial Console Settings
SERIAL_CONSOLES ?= "115200;ttyPS0"

# Yocto arm-trusted-firmware(TF-A) variables
TFA_CONSOLE ?= "cadence"
TFA_BL33_LOAD ?= "0x8000000"

# Yocto u-boot-xlnx variables
UBOOT_USER_SPECIFIED_TEXT_BASE ?= "0x8000000"

# Set DDR Base address for u-boot-xlnx-scr variables
DDR_BASEADDR ?= "0x0"
SKIP_APPEND_BASEADDR ?= "0"

# Yocto KERNEL Variables
UBOOT_ENTRYPOINT ?= "0x200000"
UBOOT_LOADADDRESS ?= "0x200000"

# Yocto MACHINE_FEATURES Variable
# By default, gen-machine-conf includes vcu and mali400 machine
# features for ZynqMP EV devices. This is not needed for OpenBMC
# and it is safe to remove.

MACHINE_FEATURES += "fpga-overlay efi"

# Yocto MACHINE_HWCODECS Variable
# By default, gen-machine-conf sets libvcu-omxil machine hw codecs
# for ZynqMP EV devices based on vcu machine features. This is
# not needed for OpenBMC and it is safe to remove.

MACHINE_HWCODECS = ""

# Use zcu104-openbmc-sd-efi.wks as the default WIC file. Users
# can override it in local.conf if needed.

WKS_FILE ?= "${@bb.utils.contains('COMBINED_FEATURES', 'efi', 'zcu104-openbmc-sd-efi.wks', 'xilinx-default-sd.wks', d)}"

# Required generic machine inclusion
require conf/machine/zynqmp-generic.conf

QB_MEM = "-m 4G"
QEMU_HW_DTB_PS = "${QEMU_HW_DTB_PATH}/board-zynqmp-zcu104.dtb"
QEMU_HW_DTB_PMU = "${QEMU_HW_DTB_PATH}/zynqmp-pmu.dtb"

# This is an 'SDT' based BSP
XILINX_WITH_ESW = "sdt"

# Original SDT artifacts URL
SDT_URI = "https://edf.amd.com/sswreleases/rel-v2026.2/sdt/2026.2/2026.2_1103_1_11030216/external/zynqmp-zcu104-sdt-full/zynqmp-zcu104-sdt-full_2026.2_1103_1_11030216.tar.gz"
SDT_URI[sha256sum] = "cedebfdf9b4bab48c006b81120d346c382c3cdc6c7e814adbacd25965a0afb1a"
SDT_URI[S] = "${UNPACKDIR}/zynqmp-zcu104-sdt-full_2026.2_1103_1_11030216"

# Set the system device trees
SYSTEM_DTFILE_DEPENDS = "sdt-artifacts"
SYSTEM_DTFILE_DIR = "${RECIPE_SYSROOT}${datadir}/sdt/${MACHINE}"
SYSTEM_DTFILE = "${SYSTEM_DTFILE_DIR}/system-top.dts"

# Load the dynamic machine features
include conf/machine/include/zcu104-openbmc/${BB_CURRENT_MC}-features.conf
LIBXIL_CONFIG = "conf/machine/include/zcu104-openbmc/${BB_CURRENT_MC}-libxil.conf"

# Primary Bootmode value
DEFAULT_HW_BOOT_MODE = "5"

# Update bootbin to use proper device tree
BIF_PARTITION_IMAGE[device-tree] = "${DTB_FILE_PATH}"

# Remap boot files to ensure the right device tree is listed first
IMAGE_BOOT_FILES =+ "devicetree/${@os.path.basename(d.getVar('CONFIG_DTFILE').replace('.dts', '.dtb'))}"
PACKAGE_EXTRA_ARCHS:append = " zynqmp_zcu104_sdt_full"

#### No additional settings should be after the Postamble
#### Postamble
PACKAGE_EXTRA_ARCHS:append = "${@['', ' zcu104_openbmc']['zcu104-openbmc' != '${MACHINE}']}"
